---
- name: CIS 3.3.2.5 - Configure IPv6 all accept_source_route
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Ensure persistent IPv6 all accept_source_route setting
      ansible.builtin.lineinfile:
        path: /etc/sysctl.d/99-cis-3.3.2.5.conf
        regexp: '^\s*net\.ipv6\.conf\.all\.accept_source_route\s*='
        line: 'net.ipv6.conf.all.accept_source_route = 0'
        create: true
        owner: root
        group: root
        mode: '0644'

    - name: Apply sysctl configuration
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true

    - name: Verify runtime value
      ansible.builtin.command:
        cmd: sysctl -n net.ipv6.conf.all.accept_source_route
      register: value
      changed_when: false

    - name: Verify persistent value
      ansible.builtin.command:
        cmd: grep -E '^[[:space:]]*net\.ipv6\.conf\.all\.accept_source_route[[:space:]]*=[[:space:]]*0([[:space:]]|$)' /etc/sysctl.d/99-cis-3.3.2.5.conf
      register: config
      changed_when: false

    - name: Assert CIS compliance
      ansible.builtin.assert:
        that:
          - value.stdout | trim == "0"
          - config.rc == 0
        success_msg: "CIS 3.3.2.5 compliant - net.ipv6.conf.all.accept_source_route = 0"
        fail_msg: "CIS 3.3.2.5 is not correctly configured"

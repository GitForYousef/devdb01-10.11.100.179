---
- name: CIS 3.3.1.8 - Configure IPv4 accept_redirects
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Ensure persistent IPv4 accept_redirects setting
      ansible.builtin.lineinfile:
        path: /etc/sysctl.d/99-cis-3.3.1.8.conf
        regexp: '^\s*net\.ipv4\.conf\.all\.accept_redirects\s*='
        line: 'net.ipv4.conf.all.accept_redirects = 0'
        create: true
        owner: root
        group: root
        mode: '0644'

    - name: Apply sysctl configuration
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true

    - name: Verify runtime value
      ansible.builtin.command:
        cmd: sysctl -n net.ipv4.conf.all.accept_redirects
      register: value
      changed_when: false

    - name: Verify persistent value
      ansible.builtin.command:
        cmd: grep -E '^[[:space:]]*net\.ipv4\.conf\.all\.accept_redirects[[:space:]]*=[[:space:]]*0([[:space:]]|$)' /etc/sysctl.d/99-cis-3.3.1.8.conf
      register: config
      changed_when: false

    - name: Assert CIS compliance
      ansible.builtin.assert:
        that:
          - value.stdout | trim == "0"
          - config.rc == 0
        success_msg: "CIS 3.3.1.8 compliant - net.ipv4.conf.all.accept_redirects = 0"
        fail_msg: "CIS 3.3.1.8 is not correctly configured"

---
###############################################################################
#
# Ansible Remediation
# Tenable / CIS Finding:
# 5.3.3.3.1 Ensure password history remember is configured
#
# Purpose:
#   Configure pam_pwhistory to remember the previous 24 passwords.
#
# Configuration:
#   remember=24
#   enforce_for_root
#   use_authtok
#
###############################################################################

- name: Remediate CIS 5.3.3.3.1 - Configure password history remember
  hosts: all
  become: true
  gather_facts: true

  tasks:

    ###########################################################################
    # 1. Ensure PAM configuration directory exists
    ###########################################################################

    - name: Ensure pam-configs directory exists
      ansible.builtin.file:
        path: /usr/share/pam-configs
        state: directory
        owner: root
        group: root
        mode: '0755'

    ###########################################################################
    # 2. Create pam_pwhistory profile
    ###########################################################################

    - name: Create pam_pwhistory configuration profile
      ansible.builtin.copy:
        dest: /usr/share/pam-configs/pwhistory
        owner: root
        group: root
        mode: '0644'
        content: |
          Name: pwhistory password history checking
          Default: yes
          Priority: 1024
          Password-Type: Primary
          Password:
                  requisite pam_pwhistory.so remember=24 enforce_for_root use_authtok
      register: pwhistory_profile

    ###########################################################################
    # 3. Enable the PAM profile
    ###########################################################################

    - name: Enable pam_pwhistory profile
      ansible.builtin.command:
        cmd: pam-auth-update --package --enable pwhistory
      register: pam_auth_update
      changed_when: false

    ###########################################################################
    # 4. Verify common-password contains pam_pwhistory
    ###########################################################################

    - name: Check pam_pwhistory in common-password
      ansible.builtin.shell: |
        grep -E '^[[:space:]]*password[[:space:]]+(requisite|required|sufficient)[[:space:]]+pam_pwhistory\.so' \
        /etc/pam.d/common-password
      register: pwhistory_common_password
      changed_when: false
      failed_when: false

    ###########################################################################
    # 5. Verify remember=24
    ###########################################################################

    - name: Verify remember=24 is configured
      ansible.builtin.shell: |
        grep -E '^[[:space:]]*password[[:space:]]+(requisite|required|sufficient)[[:space:]]+pam_pwhistory\.so.*remember=([2-9][4-9]|[3-9][0-9]|[1-9][0-9]{2,})\b' \
        /etc/pam.d/common-password
      register: pwhistory_remember
      changed_when: false
      failed_when: false

    - name: Assert password history remember is configured
      ansible.builtin.assert:
        that:
          - pwhistory_remember.rc == 0
        fail_msg: >-
          pam_pwhistory remember value of 24 or greater was not found
          in /etc/pam.d/common-password.
        success_msg: >-
          pam_pwhistory remember value is correctly configured to 24 or greater.

    ###########################################################################
    # 6. Verify enforce_for_root
    ###########################################################################

    - name: Verify enforce_for_root is configured
      ansible.builtin.shell: |
        grep -E '^[[:space:]]*password[[:space:]]+(requisite|required|sufficient)[[:space:]]+pam_pwhistory\.so.*enforce_for_root' \
        /etc/pam.d/common-password
      register: pwhistory_root
      changed_when: false
      failed_when: false

    - name: Assert enforce_for_root is configured
      ansible.builtin.assert:
        that:
          - pwhistory_root.rc == 0
        fail_msg: >-
          enforce_for_root is missing from pam_pwhistory configuration.
        success_msg: >-
          enforce_for_root is configured.

    ###########################################################################
    # 7. Display final configuration
    ###########################################################################

    - name: Display pam_pwhistory configuration
      ansible.builtin.command:
        cmd: grep -E 'pam_pwhistory\.so' /etc/pam.d/common-password
      register: final_pwhistory
      changed_when: false

    - name: Display remediation result
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CIS 5.3.3.3.1 REMEDIATION COMPLETE"
          - "=============================================="
          - "PAM module: pam_pwhistory"
          - "Password history: 24 passwords"
          - "Root enforcement: ENABLED"
          - "PAM profile enabled: YES"
          - "common-password verified: YES"
          - "=============================================="

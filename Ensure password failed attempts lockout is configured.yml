---
###############################################################################
#
# Ansible Remediation
# Tenable / CIS Finding:
# 5.3.3.1.1 Ensure password failed attempts lockout is configured
#
# Requirement:
#   deny <= 5
#
###############################################################################

- name: Remediate CIS 5.3.3.1.1 - Configure password failed attempts lockout
  hosts: all
  become: true
  gather_facts: true

  tasks:

    ###########################################################################
    # 1. Configure faillock deny value
    ###########################################################################

    - name: Configure faillock deny value
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: '^\s*#?\s*deny\s*='
        line: 'deny = 5'
        create: true
        owner: root
        group: root
        mode: '0644'
      register: faillock_deny_config

    ###########################################################################
    # 2. Verify deny configuration
    ###########################################################################

    - name: Check faillock deny configuration
      ansible.builtin.shell: |
        grep -Pi '^\h*deny\h*=\h*[1-5]\b' /etc/security/faillock.conf
      register: faillock_deny_check
      changed_when: false
      failed_when: false

    ###########################################################################
    # 3. Verify pam_faillock lines do not contain deny argument
    ###########################################################################

    - name: Check pam_faillock deny argument in PAM profiles
      ansible.builtin.shell: |
        grep -Pl -- '\bpam_faillock\.so\h+([^#\n\r]+\h+)?deny\b' \
        /usr/share/pam-configs/* 2>/dev/null
      register: pam_faillock_deny_check
      changed_when: false
      failed_when: false

    ###########################################################################
    # 4. Assert deny is correctly configured
    ###########################################################################

    - name: Assert faillock deny is configured correctly
      ansible.builtin.assert:
        that:
          - faillock_deny_check.rc == 0
          - faillock_deny_check.stdout is search('(?i)^\\s*deny\\s*=\\s*[1-5]\\b')
        fail_msg: |
          faillock deny value is not correctly configured.

          Expected:
          deny = 5

          Actual:
          {{ faillock_deny_check.stdout }}
        success_msg: |
          faillock deny is correctly configured.
          Maximum allowed failed attempts: 5.

    ###########################################################################
    # 5. Assert deny is not specified in PAM profile
    ###########################################################################

    - name: Assert deny is not specified in pam_faillock PAM profiles
      ansible.builtin.assert:
        that:
          - pam_faillock_deny_check.rc != 0
        fail_msg: |
          A deny= argument was found in a pam_faillock PAM profile.
          Tenable expects the deny value to be configured in
          /etc/security/faillock.conf.

          Found:
          {{ pam_faillock_deny_check.stdout }}
        success_msg: |
          No deny= argument found in pam_faillock PAM profiles.
          Central faillock.conf configuration is being used.

    ###########################################################################
    # 6. Display final result
    ###########################################################################

    - name: Display remediation result
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CIS 5.3.3.1.1 REMEDIATION COMPLETE"
          - "=============================================="
          - "Configuration file: /etc/security/faillock.conf"
          - "Failed attempts allowed: 5"
          - "Lockout threshold: 5 consecutive failures"
          - "Status: COMPLIANT"
          - "=============================================="

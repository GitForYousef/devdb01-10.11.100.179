---
###############################################################################
#
# Ansible Remediation
# Tenable / CIS Finding:
# 5.3.3.3.2 Ensure password history is enforced for the root user
#
# Configuration:
#   pam_pwhistory.so
#   remember=24
#   enforce_for_root
#   use_authtok
#
###############################################################################

- name: Remediate CIS 5.3.3.3.2 - Enforce password history for root
  hosts: all
  become: true
  gather_facts: true

  tasks:

    ###########################################################################
    # 1. Create PAM configuration profile
    ###########################################################################

    - name: Create pam_pwhistory profile
      ansible.builtin.copy:
        dest: /usr/share/pam-configs/pwhistory
        owner: root
        group: root
        mode: '0644'
        content: |
          Name: pwhistory password history checking
          Default: yes
          Priority: 1024
          Password-Type: Primary
          Password:
                  requisite pam_pwhistory.so remember=24 enforce_for_root use_authtok

    ###########################################################################
    # 2. Enable PAM profile
    ###########################################################################

    - name: Enable pam_pwhistory profile
      ansible.builtin.command:
        cmd: pam-auth-update --package --enable pwhistory
      register: pam_update
      changed_when: false

    ###########################################################################
    # 3. Verify enforce_for_root
    ###########################################################################

    - name: Check enforce_for_root in common-password
      ansible.builtin.shell: |
        grep -Pi '^\h*password\h+[^#\n\r]+\h+pam_pwhistory\.so\h+([^#\n\r]+\h+)?enforce_for_root\b' \
        /etc/pam.d/common-password
      register: pwhistory_root_check
      changed_when: false
      failed_when: false

    ###########################################################################
    # 4. Verify configuration
    ###########################################################################

    - name: Assert password history is enforced for root
      ansible.builtin.assert:
        that:
          - pwhistory_root_check.rc == 0
          - "'pam_pwhistory.so' in pwhistory_root_check.stdout"
          - "'enforce_for_root' in pwhistory_root_check.stdout"
        fail_msg: >-
          pam_pwhistory enforce_for_root is NOT configured in
          /etc/pam.d/common-password.
        success_msg: >-
          pam_pwhistory enforce_for_root is correctly configured for root.

    ###########################################################################
    # 5. Display final configuration
    ###########################################################################

    - name: Display final pam_pwhistory configuration
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CIS 5.3.3.3.2 REMEDIATION COMPLETE"
          - "=============================================="
          - "PAM module: pam_pwhistory"
          - "Password history: remember=24"
          - "Root enforcement: enforce_for_root"
          - "Authtok: use_authtok"
          - "PAM profile: pwhistory"
          - "Status: COMPLIANT"
          - "=============================================="

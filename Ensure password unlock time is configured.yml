---
###############################################################################
#
# Ansible Remediation
# Tenable / CIS Finding:
# 5.3.3.1.2 Ensure password unlock time is configured
#
# Requirement:
#   unlock_time must be 0 or >= 900
#
# Configuration:
#   unlock_time = 900
#
###############################################################################

- name: Remediate CIS 5.3.3.1.2 - Configure password unlock time
  hosts: all
  become: true
  gather_facts: true

  tasks:

    ###########################################################################
    # 1. Configure unlock_time
    ###########################################################################

    - name: Configure faillock unlock time
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: '^\s*#?\s*unlock_time\s*='
        line: 'unlock_time = 900'
        create: true
        owner: root
        group: root
        mode: '0644'
      register: faillock_unlock_config

    ###########################################################################
    # 2. Verify unlock_time configuration
    ###########################################################################

    - name: Check faillock unlock_time configuration
      ansible.builtin.shell: |
        grep -Pi '^\h*unlock_time\h*=\h*(0|[9][0-9]{2,}|[1-9][0-9]{3,})\b' \
        /etc/security/faillock.conf
      register: faillock_unlock_check
      changed_when: false
      failed_when: false

    ###########################################################################
    # 3. Check for unlock_time argument in PAM profiles
    ###########################################################################

    - name: Check pam_faillock PAM profiles for unlock_time argument
      ansible.builtin.shell: |
        grep -Pl -- '\bpam_faillock\.so\h+([^#\n\r]+\h+)?unlock_time\b' \
        /usr/share/pam-configs/* 2>/dev/null
      register: pam_faillock_unlock_check
      changed_when: false
      failed_when: false

    ###########################################################################
    # 4. Assert unlock_time is correctly configured
    ###########################################################################

    - name: Assert faillock unlock_time is configured
      ansible.builtin.assert:
        that:
          - faillock_unlock_check.rc == 0
        fail_msg: |
          faillock unlock_time is not correctly configured.

          Expected:
          unlock_time = 900

          Actual:
          {{ faillock_unlock_check.stdout }}
        success_msg: |
          faillock unlock_time is correctly configured.
          Account unlock time: 900 seconds (15 minutes).

    ###########################################################################
    # 5. Assert unlock_time is not specified in PAM profiles
    ###########################################################################

    - name: Assert unlock_time is not specified in pam_faillock PAM profiles
      ansible.builtin.assert:
        that:
          - pam_faillock_unlock_check.rc != 0
        fail_msg: |
          unlock_time= argument was found in a pam_faillock PAM profile.

          Tenable expects unlock_time to be configured centrally in:
          /etc/security/faillock.conf

          Found:
          {{ pam_faillock_unlock_check.stdout }}

          Remove unlock_time=<N> from the PAM profile.
        success_msg: |
          No unlock_time argument found in pam_faillock PAM profiles.
          Central faillock.conf configuration is being used.

    ###########################################################################
    # 6. Final verification
    ###########################################################################

    - name: Display remediation result
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CIS 5.3.3.1.2 REMEDIATION COMPLETE"
          - "=============================================="
          - "Configuration file: /etc/security/faillock.conf"
          - "Unlock time: 900 seconds (15 minutes)"
          - "Status: COMPLIANT"
          - "=============================================="

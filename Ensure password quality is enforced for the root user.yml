---
###############################################################################
#
# Ansible Remediation
# Tenable / CIS Finding:
# 5.3.3.2.8 Ensure password quality is enforced for the root user
#
# Purpose:
#   Ensure pam_pwquality enforces password quality requirements when
#   the root user changes a password.
#
# Configuration:
#   enforce_for_root
#
###############################################################################

- name: Remediate CIS 5.3.3.2.8 - Enforce password quality for root
  hosts: all
  become: true
  gather_facts: true

  tasks:

    ###########################################################################
    # 1. Ensure pwquality configuration directory exists
    ###########################################################################

    - name: Ensure pwquality configuration directory exists
      ansible.builtin.file:
        path: /etc/security/pwquality.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    ###########################################################################
    # 2. Configure enforce_for_root
    ###########################################################################

    - name: Enable password quality enforcement for root
      ansible.builtin.copy:
        dest: /etc/security/pwquality.conf.d/50-pwroot.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          enforce_for_root
      register: pwroot_config

    ###########################################################################
    # 3. Verify configuration file
    ###########################################################################

    - name: Check pwquality root enforcement configuration
      ansible.builtin.shell: |
        grep -E '^[[:space:]]*enforce_for_root([[:space:]]*)$' \
        /etc/security/pwquality.conf \
        /etc/security/pwquality.conf.d/*.conf 2>/dev/null
      register: pwroot_verify
      changed_when: false
      failed_when: false

    ###########################################################################
    # 4. Assert configuration is present
    ###########################################################################

    - name: Verify enforce_for_root is configured
      ansible.builtin.assert:
        that:
          - pwroot_verify.rc == 0
          - "'enforce_for_root' in pwroot_verify.stdout"
        fail_msg: >-
          pwquality enforce_for_root is not configured.
        success_msg: >-
          pwquality enforce_for_root is correctly configured.

    ###########################################################################
    # 5. Display final status
    ###########################################################################

    - name: Display remediation result
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CIS 5.3.3.2.8 REMEDIATION COMPLETE"
          - "=============================================="
          - "Configuration:"
          - "/etc/security/pwquality.conf.d/50-pwroot.conf"
          - "Setting: enforce_for_root"
          - "Root password quality enforcement: ENABLED"
          - "=============================================="

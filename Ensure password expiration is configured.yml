---
- name: CIS 5.4.1.1 - Configure Password Expiration
  hosts: all
  become: true
  gather_facts: true

  vars:
    password_max_days: 365

  tasks:

    #####################################################################
    # 1. Configure PASS_MAX_DAYS in /etc/login.defs
    #####################################################################

    - name: Configure PASS_MAX_DAYS in /etc/login.defs
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*PASS_MAX_DAYS\s+'
        line: "PASS_MAX_DAYS {{ password_max_days }}"
        state: present
        backup: true

    #####################################################################
    # 2. Find local users with password hashes
    #####################################################################

    - name: Get local users with password hashes
      ansible.builtin.shell: |
        awk -F: '($2 ~ /^\$.+\$/) {print $1 ":" $5}' /etc/shadow
      register: password_users
      changed_when: false

    #####################################################################
    # 3. Configure maximum password age for existing users
    #####################################################################

    - name: Set maximum password age to 365 days for existing users
      ansible.builtin.command:
        cmd: "chage --maxdays {{ password_max_days }} {{ item.split(':')[0] }}"
      loop: "{{ password_users.stdout_lines }}"
      when:
        - item.split(':')[1] | int > password_max_days
          or item.split(':')[1] | int < 1

    #####################################################################
    # 4. Verify /etc/login.defs
    #####################################################################

    - name: Verify PASS_MAX_DAYS configuration
      ansible.builtin.shell: |
        grep -Pi '^\h*PASS_MAX_DAYS\h+{{ password_max_days }}\b' /etc/login.defs
      register: pass_max_days_check
      changed_when: false

    - name: Assert PASS_MAX_DAYS is configured correctly
      ansible.builtin.assert:
        that:
          - pass_max_days_check.rc == 0
        fail_msg: "PASS_MAX_DAYS is not configured as {{ password_max_days }}"
        success_msg: "PASS_MAX_DAYS is correctly configured as {{ password_max_days }}"

    #####################################################################
    # 5. Verify existing users
    #####################################################################

    - name: Check for users with invalid password maximum age
      ansible.builtin.shell: |
        awk -F: '($2~/^\$.+\$/) {
          if($5 > {{ password_max_days }} || $5 < 1)
            print "User: " $1 " PASS_MAX_DAYS: " $5
        }' /etc/shadow
      register: shadow_check
      changed_when: false

    - name: Display password expiration validation
      ansible.builtin.debug:
        msg: >-
          {{
            shadow_check.stdout
            if shadow_check.stdout | length > 0
            else 'All password-enabled users have PASS_MAX_DAYS configured correctly.'
          }}

    #####################################################################
    # 6. Final assertion
    #####################################################################

    - name: Assert no users have invalid password expiration
      ansible.builtin.assert:
        that:
          - shadow_check.stdout | length == 0
        fail_msg: "One or more users still have invalid PASS_MAX_DAYS."
        success_msg: "CIS 5.4.1.1 remediation completed successfully."

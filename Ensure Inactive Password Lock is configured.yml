---
- name: CIS 5.4.1.5 - Configure Inactive Password Lock
  hosts: all
  become: true
  gather_facts: true

  vars:
    inactive_days: 45

  tasks:

    #####################################################################
    # 1. Configure default inactive period for NEW users
    #####################################################################

    - name: Set default inactive password lock to 45 days
      ansible.builtin.command:
        cmd: "useradd -D -f {{ inactive_days }}"
      register: useradd_default
      changed_when: false

    #####################################################################
    # 2. Get existing users with password hashes
    #####################################################################

    - name: Get password-enabled users
      ansible.builtin.shell: |
        awk -F: '($2 ~ /^\$.+\$/) {print $1 ":" $7}' /etc/shadow
      register: password_users
      changed_when: false

    #####################################################################
    # 3. Configure inactive period for existing users
    #####################################################################

    - name: Set inactive password lock to 45 days
      ansible.builtin.command:
        cmd: "chage --inactive {{ inactive_days }} {{ item.split(':')[0] }}"
      loop: "{{ password_users.stdout_lines }}"
      when:
        - item.split(':')[1] | int > inactive_days
          or item.split(':')[1] | int < 0

    #####################################################################
    # 4. Verify useradd default
    #####################################################################

    - name: Check default INACTIVE setting
      ansible.builtin.shell: |
        useradd -D | grep '^INACTIVE='
      register: inactive_default_check
      changed_when: false

    - name: Display default inactive setting
      ansible.builtin.debug:
        var: inactive_default_check.stdout

    - name: Assert default INACTIVE is 45
      ansible.builtin.assert:
        that:
          - inactive_default_check.stdout == 'INACTIVE=45'
        fail_msg: "Default INACTIVE is not configured as 45 days."
        success_msg: "Default INACTIVE is correctly configured as 45 days."

    #####################################################################
    # 5. Verify existing users
    #####################################################################

    - name: Check existing users for invalid inactive period
      ansible.builtin.shell: |
        awk -F: '($2~/^\$.+\$/) {
          if($7 > {{ inactive_days }} || $7 < 0)
            print "User: " $1 " INACTIVE: " $7
        }' /etc/shadow
      register: inactive_users_check
      changed_when: false

    - name: Display inactive user validation
      ansible.builtin.debug:
        msg: >-
          {{
            inactive_users_check.stdout
            if inactive_users_check.stdout | length > 0
            else 'All password-enabled users have inactive period <= 45 days.'
          }}

    #####################################################################
    # 6. Final validation
    #####################################################################

    - name: Assert no users have invalid inactive period
      ansible.builtin.assert:
        that:
          - inactive_users_check.stdout | length == 0
        fail_msg: "One or more users have an invalid inactive password period."
        success_msg: "CIS 5.4.1.5 remediation completed successfully."
